name: Test python

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.13"]' || '["3.10","3.11","3.12","3.13"]') }}
      fail-fast: false
    defaults:
      run:
        shell: bash
    env:
      PYTHON_PACKAGE_NAME: bq_validator
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: bash dev/setup.sh --deps "development"
      - name: Run tests
        run: uv run bash dev/test_python.sh
      - name: Test build
        run: uv run bash dev/build.sh
      - name: Test installation
        run: |
          uv pip install -e .
          uv run python -c 'import ${{ env.PYTHON_PACKAGE_NAME }}'
      - name: Trunk Check
        if: matrix.python-version == '3.13' && github.event_name != 'push'
        uses: trunk-io/trunk-action@v1
